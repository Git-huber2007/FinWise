<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 330" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-canvas" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#05070B" />
      <stop offset="50%" stop-color="#080C16" />
      <stop offset="100%" stop-color="#05070B" />
    </linearGradient>

    <!-- Card Background Gradient -->
    <linearGradient id="card-surface" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0E1322" />
      <stop offset="100%" stop-color="#090D17" />
    </linearGradient>

    <!-- Ambient Center Spotlight -->
    <radialGradient id="card-spotlight" cx="50%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#6366F1" stop-opacity="0.12" />
      <stop offset="50%" stop-color="#38BDF8" stop-opacity="0.03" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <!-- Emblem Glow Filter -->
    <filter id="emblem-glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Subtle Dot Grid Pattern -->
    <pattern id="micro-grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="12" cy="12" r="0.75" fill="#1E293B" opacity="0.6" />
    </pattern>

    <!-- Icon Halo Radial -->
    <radialGradient id="halo-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6366F1" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#6366F1" stop-opacity="0" />
    </radialGradient>
  </defs>

  <style>
    .brand-title {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Geist", Roboto, "Helvetica Neue", sans-serif;
      font-size: 34px;
      font-weight: 800;
      letter-spacing: 0.22em;
      fill: #FFFFFF;
    }
    .brand-subtitle {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
      font-size: 10.5px;
      font-weight: 700;
      letter-spacing: 0.26em;
      fill: #94A3B8;
      text-transform: uppercase;
    }
    .brand-desc {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 11.5px;
      font-weight: 400;
      letter-spacing: 0.04em;
      fill: #64748B;
    }
    .pill-text {
      font-family: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;
      font-size: 10px;
      font-weight: 500;
      letter-spacing: 0.06em;
      fill: #CBD5E1;
    }
  </style>

  <!-- Outer Canvas Frame -->
  <rect x="0" y="0" width="960" height="330" rx="16" fill="url(#bg-canvas)" />

  <!-- Inner Architectural Card Frame -->
  <g transform="translate(32, 24)">
    <!-- Card Base Fill & Border -->
    <rect x="0" y="0" width="896" height="282" rx="16" fill="url(#card-surface)" stroke="#1E293B" stroke-width="1.2" />

    <!-- Card Background Grid & Ambient Spotlight -->
    <rect x="0" y="0" width="896" height="282" rx="16" fill="url(#micro-grid)" />
    <rect x="0" y="0" width="896" height="282" rx="16" fill="url(#card-spotlight)" />

    <!-- Top Card Inset Highlight Line -->
    <line x1="24" y1="1" x2="872" y2="1" stroke="#334155" stroke-opacity="0.4" stroke-width="1" />

    <!-- Top Emblem / Shield Icon with Halo -->
    <g transform="translate(448, 56)">
      <!-- Outer Glow Ring -->
      <circle cx="0" cy="0" r="32" fill="url(#halo-glow)" />

      <!-- Inner Badge Hexagon/Shield Base -->
      <circle cx="0" cy="0" r="23" fill="#0E1628" stroke="#3B82F6" stroke-width="1.5" />
      <circle cx="0" cy="0" r="23" fill="none" stroke="#6366F1" stroke-width="1" opacity="0.6" filter="url(#emblem-glow)" />

      <!-- Precision Financial Vault Icon (Shield + Delta Trend Spark) -->
      <path d="M -9 -7 L 0 -13 L 9 -7 L 9 3 C 9 8 5 13 0 15 C -5 13 -9 8 -9 3 Z" 
            fill="none" stroke="#38BDF8" stroke-width="1.75" stroke-linejoin="round" />
      <!-- Inner Delta Trendline -->
      <path d="M -5 3 L -2 0 L 1 2 L 5 -3" 
            fill="none" stroke="#10B981" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" />
    </g>

    <!-- Brand Identity Header -->
    <g transform="translate(448, 118)" text-anchor="middle">
      <text x="0" y="0" class="brand-title">FINWISE</text>
      <text x="0" y="24" class="brand-subtitle">INTELLIGENT AUTONOMOUS PERSONAL FINANCE &amp; SPENDING PLATFORM</text>
      <text x="0" y="47" class="brand-desc">
        Offline Scikit-Learn Intelligence · Deterministic Double-Entry Math · Dual-Model Debt Optimization (Avalanche/Snowball)
      </text>
    </g>

    <!-- Bottom Interactive Pill Tags (Matching Reference Layout) -->
    <g transform="translate(56, 218)">
      <!-- Pill 1: Scikit-Learn ML Engine (Indigo/Cobalt) -->
      <g transform="translate(0, 0)">
        <rect x="0" y="0" width="176" height="30" rx="15" fill="#0C1322" stroke="#1E293B" stroke-width="1" />
        <circle cx="16" cy="15" r="3.5" fill="#6366F1" />
        <circle cx="16" cy="15" r="6" fill="#6366F1" opacity="0.25" />
        <text x="28" y="18.5" class="pill-text">Local ML Categorizer</text>
      </g>

      <!-- Pill 2: Mathematical Ledger (Emerald) -->
      <g transform="translate(192, 0)">
        <rect x="0" y="0" width="194" height="30" rx="15" fill="#0C1322" stroke="#1E293B" stroke-width="1" />
        <circle cx="16" cy="15" r="3.5" fill="#10B981" />
        <circle cx="16" cy="15" r="6" fill="#10B981" opacity="0.25" />
        <text x="28" y="18.5" class="pill-text">Deterministic Ledger</text>
      </g>

      <!-- Pill 3: Tax Engine 115BAC (Purple) -->
      <g transform="translate(402, 0)">
        <rect x="0" y="0" width="196" height="30" rx="15" fill="#0C1322" stroke="#1E293B" stroke-width="1" />
        <circle cx="16" cy="15" r="3.5" fill="#A855F7" />
        <circle cx="16" cy="15" r="6" fill="#A855F7" opacity="0.25" />
        <text x="28" y="18.5" class="pill-text">Section 115BAC Engine</text>
      </g>

      <!-- Pill 4: Zero Cloud Dependency (Amber) -->
      <g transform="translate(614, 0)">
        <rect x="0" y="0" width="170" height="30" rx="15" fill="#0C1322" stroke="#1E293B" stroke-width="1" />
        <circle cx="16" cy="15" r="3.5" fill="#F59E0B" />
        <circle cx="16" cy="15" r="6" fill="#F59E0B" opacity="0.25" />
        <text x="28" y="18.5" class="pill-text">Zero-Trust Local Data</text>
      </g>
    </g>
  </g>
</svg>