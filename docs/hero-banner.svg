<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 320" width="100%" height="100%">
  <defs>
    <!-- Background Dot Pattern with Warm Metallic Tint -->
    <pattern id="dot-grid" x="0" y="0" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#334155" opacity="0.45" />
    </pattern>

    <!-- Warm Golden Ambient Radial Glow -->
    <radialGradient id="center-glow" cx="50%" cy="32%" r="52%">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.16" />
      <stop offset="45%" stop-color="#6366F1" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <!-- Imperial Gold to Sunset Amber Gradient for Emblem -->
    <linearGradient id="gold-emblem-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>

    <!-- Title Gradient (Brilliant Pure White to Soft Champagne) -->
    <linearGradient id="title-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="50%" stop-color="#F8FAFC" />
      <stop offset="100%" stop-color="#FEF08A" />
    </linearGradient>

    <!-- Icon Glow Filter -->
    <filter id="icon-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="7" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .title {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      font-size: 34px;
      font-weight: 800;
      letter-spacing: 0.22em;
      fill: url(#title-grad);
      text-anchor: middle;
    }
    .subtitle {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.26em;
      fill: #FBBF24;
      text-anchor: middle;
      text-transform: uppercase;
    }
    .meta {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      font-size: 12px;
      font-weight: 400;
      letter-spacing: 0.04em;
      fill: #94A3B8;
      text-anchor: middle;
    }
    .pill-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.03em;
      fill: #E2E8F0;
    }
  </style>

  <!-- Deep Obsidian Container Card -->
  <rect x="8" y="8" width="984" height="304" rx="16" fill="#07090E" stroke="#1E2738" stroke-width="1.5" />

  <!-- Dot Grid Pattern Fill -->
  <rect x="9" y="9" width="982" height="302" rx="15" fill="url(#dot-grid)" />

  <!-- Center Ambient Radial Glow (Gold & Indigo) -->
  <rect x="9" y="9" width="982" height="302" rx="15" fill="url(#center-glow)" />

  <!-- Center Icon: Geometric Vault & Diamond Node with Imperial Gold Halo -->
  <g transform="translate(500, 56)" filter="url(#icon-glow)">
    <!-- Outer Octagon / Circle Ring -->
    <circle cx="0" cy="0" r="28" fill="#14110A" stroke="url(#gold-emblem-grad)" stroke-width="2" />
    <!-- Vault / Gem Diamond Polygon -->
    <path d="M-8 -11 L8 -11 L13 -3 L0 13 L-13 -3 Z" fill="none" stroke="#FBBF24" stroke-width="2" stroke-linejoin="round" />
    <path d="M-13 -3 L13 -3" stroke="#FDE68A" stroke-width="1.4" opacity="0.8" />
    <path d="M-8 -11 L0 13 L8 -11" stroke="#F59E0B" stroke-width="1.4" opacity="0.75" />
    <!-- Center Radiant Core -->
    <circle cx="0" cy="2" r="2.5" fill="#FFFFFF" />
  </g>

  <!-- Main Headline: FINWISE -->
  <text x="500" y="130" class="title">FINWISE</text>

  <!-- Subtitle with Warm Gold Tint -->
  <text x="500" y="156" class="subtitle">AUTONOMOUS PERSONAL FINANCE &amp; SPENDING INTELLIGENCE PLATFORM</text>

  <!-- Secondary Metadata Line -->
  <text x="500" y="184" class="meta">Double-Entry Style Ledger · Offline Scikit-Learn ML · Emergency Runway Simulator · Indian Tax 115BAC</text>

  <!-- Pill Badges Row (Distinct Financial Palette) -->
  <g transform="translate(500, 236)">
    <!-- Pill 1: Royal Blue Dot -->
    <g transform="translate(-360, 0)">
      <rect x="-85" y="-14" width="170" height="28" rx="14" fill="#0D1322" stroke="#1E293B" stroke-width="1" />
      <circle cx="-68" cy="0" r="3.5" fill="#3B82F6" />
      <text x="-56" y="4" class="pill-text">Autonomous Ledger</text>
    </g>

    <!-- Pill 2: Warm Amber Gold Dot -->
    <g transform="translate(-120, 0)">
      <rect x="-95" y="-14" width="190" height="28" rx="14" fill="#14120B" stroke="#2D2310" stroke-width="1" />
      <circle cx="-78" cy="0" r="3.5" fill="#F59E0B" />
      <text x="-66" y="4" class="pill-text">Tax Regime (115BAC)</text>
    </g>

    <!-- Pill 3: Sunset Coral Ruby Dot -->
    <g transform="translate(130, 0)">
      <rect x="-95" y="-14" width="190" height="28" rx="14" fill="#160D14" stroke="#331424" stroke-width="1" />
      <circle cx="-78" cy="0" r="3.5" fill="#F43F5E" />
      <text x="-66" y="4" class="pill-text">Snowball &amp; Avalanche</text>
    </g>

    <!-- Pill 4: Emerald Sage Dot -->
    <g transform="translate(360, 0)">
      <rect x="-80" y="-14" width="160" height="28" rx="14" fill="#0C1518" stroke="#132B25" stroke-width="1" />
      <circle cx="-63" cy="0" r="3.5" fill="#10B981" />
      <text x="-51" y="4" class="pill-text">Zero Cloud Leaks</text>
    </g>
  </g>
</svg>
