<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 320" width="100%" height="100%">
  <defs>
    <!-- Background Dot Pattern -->
    <pattern id="dot-grid" x="0" y="0" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#1E293B" opacity="0.65" />
    </pattern>

    <!-- Center Ambient Glow -->
    <radialGradient id="center-glow" cx="50%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#00E599" stop-opacity="0.18" />
      <stop offset="50%" stop-color="#00B4D8" stop-opacity="0.06" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <!-- Shield Icon Glow Gradient -->
    <linearGradient id="shield-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E599" />
      <stop offset="100%" stop-color="#00B4D8" />
    </linearGradient>

    <!-- Pill Border Gradient -->
    <linearGradient id="pill-border" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="50%" stop-color="#334155" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="icon-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .title {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      font-size: 34px;
      font-weight: 800;
      letter-spacing: 0.22em;
      fill: #FFFFFF;
      text-anchor: middle;
    }
    .subtitle {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.24em;
      fill: #7DD3FC;
      text-anchor: middle;
      text-transform: uppercase;
    }
    .meta {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      font-size: 12px;
      font-weight: 400;
      letter-spacing: 0.04em;
      fill: #94A3B8;
      text-anchor: middle;
    }
    .pill-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.03em;
      fill: #CBD5E1;
    }
  </style>

  <!-- Container Box with Rounded Corners -->
  <rect x="8" y="8" width="984" height="304" rx="16" fill="#06090F" stroke="#162032" stroke-width="1.5" />

  <!-- Dot Grid Pattern Fill -->
  <rect x="9" y="9" width="982" height="302" rx="15" fill="url(#dot-grid)" />

  <!-- Center Ambient Radial Glow -->
  <rect x="9" y="9" width="982" height="302" rx="15" fill="url(#center-glow)" />

  <!-- Center Icon: Glowing Shield & Currency/Ledger Emblem -->
  <g transform="translate(500, 56)" filter="url(#icon-glow)">
    <!-- Outer Ring with Gradient -->
    <circle cx="0" cy="0" r="28" fill="#0B132B" stroke="url(#shield-grad)" stroke-width="2" />
    <!-- Inner Shield Icon -->
    <path d="M-9 -10 L0 -14 L9 -10 L9 0 C9 8 0 14 0 14 C0 14 -9 8 -9 0 Z" fill="none" stroke="#00E599" stroke-width="2.2" stroke-linejoin="round" />
    <!-- Checkmark inside Shield -->
    <path d="M-4 -1 L-1 3 L5 -4" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Main Headline: FINWISE -->
  <text x="500" y="130" class="title">FINWISE</text>

  <!-- Subtitle -->
  <text x="500" y="156" class="subtitle">AUTONOMOUS PERSONAL FINANCE &amp; SPENDING INTELLIGENCE PLATFORM</text>

  <!-- Secondary Metadata Line -->
  <text x="500" y="184" class="meta">Double-Entry Style Ledger · Offline Scikit-Learn ML · Emergency Runway Simulator · Tax Regime 115BAC</text>

  <!-- Pill Badges Row -->
  <g transform="translate(500, 236)">
    <!-- Pill 1: Offline ML Engine -->
    <g transform="translate(-360, 0)">
      <rect x="-85" y="-14" width="170" height="28" rx="14" fill="#0C1322" stroke="#1E293B" stroke-width="1" />
      <circle cx="-68" cy="0" r="3.5" fill="#10B981" />
      <text x="-56" y="4" class="pill-text">Offline ML Engine</text>
    </g>

    <!-- Pill 2: Indian Tax Regime -->
    <g transform="translate(-120, 0)">
      <rect x="-95" y="-14" width="190" height="28" rx="14" fill="#0C1322" stroke="#1E293B" stroke-width="1" />
      <circle cx="-78" cy="0" r="3.5" fill="#06B6D4" />
      <text x="-66" y="4" class="pill-text">Tax Regime (115BAC)</text>
    </g>

    <!-- Pill 3: Snowball & Avalanche -->
    <g transform="translate(130, 0)">
      <rect x="-95" y="-14" width="190" height="28" rx="14" fill="#0C1322" stroke="#1E293B" stroke-width="1" />
      <circle cx="-78" cy="0" r="3.5" fill="#A855F7" />
      <text x="-66" y="4" class="pill-text">Snowball &amp; Avalanche</text>
    </g>

    <!-- Pill 4: Zero Cloud Leaks -->
    <g transform="translate(360, 0)">
      <rect x="-80" y="-14" width="160" height="28" rx="14" fill="#0C1322" stroke="#1E293B" stroke-width="1" />
      <circle cx="-63" cy="0" r="3.5" fill="#F59E0B" />
      <text x="-51" y="4" class="pill-text">Zero Cloud Leaks</text>
    </g>
  </g>
</svg>
